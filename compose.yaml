services:
  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination
      - /mlartifacts
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - mlflow:5000,localhost:*,127.0.0.1:*
      - --port
      - "5000"
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow-data
      - mlflow-artifacts:/mlartifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 3s
      timeout: 2s
      retries: 20

  trainer:
    build: .
    command: ["python", "-m", "mlops_demo.train"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: iris-classifier
    depends_on:
      mlflow:
        condition: service_healthy
    profiles: ["tools"]

  api:
    build: .
    command: ["python", "-m", "mlops_demo.api"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: iris-classifier
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  mlflow-data:
  mlflow-artifacts:
