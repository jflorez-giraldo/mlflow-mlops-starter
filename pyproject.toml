[project]
name = "mlflow-starter"
version = "0.1.0"
description = "Proyecto MLOps reproducible con MLflow, FastAPI y Docker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "mlflow>=3.1,<4",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops_demo"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "ipykernel>=6.29,<8",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
